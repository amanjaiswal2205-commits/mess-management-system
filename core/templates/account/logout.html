{% extends "core/base.html" %}
{% load i18n %}

{% block title %}Sign Out | Mess Management{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-sm-10 col-md-7 col-lg-5">
    <div class="card fade-in-up">
      <div class="card-body p-4 p-md-5 text-center">
        <div class="mb-3">
          <span class="badge bg-danger-subtle text-danger">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
              <path d="M13 3a1 1 0 0 1 1 1v7.59l2.3-2.3a1 1 0 1 1 1.4 1.42l-4 4a1 1 0 0 1-1.4 0l-4-4a1 1 0 1 1 1.4-1.42l2.3 2.3V4a1 1 0 0 1 1-1zm-2 14a1 1 0 1 0 2 0h-2zm-4 2a1 1 0 0 1 1-1h8a1 1 0 1 1 0 2h-8a1 1 0 0 1-1-1z"/>
            </svg>
          </span>
        </div>

        <h3 class="mb-2">{% trans "Sign Out" %}</h3>
        <p class="text-muted mb-4">{% trans "Are you sure you want to sign out?" %}</p>

        <form method="post" action="{% url 'account_logout' %}" class="d-grid gap-2 d-sm-flex justify-content-sm-center">
          {% csrf_token %}
          {{ redirect_field }}
          <button type="submit" class="btn btn-danger btn-lg px-5">
            {% trans "Sign Out" %}
          </button>
          <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary btn-lg px-5">
            {% trans "Cancel" %}
          </a>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
