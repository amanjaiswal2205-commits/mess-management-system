
{% if wrapper_class %}<div class="{{ wrapper_class }}"{% if wrapper_attrs %} {{ wrapper_attrs }}{% endif %}>{% endif %}
<label for="{{ field.id_for_label }}" class="form-label">
  {{ field.label }}
  {% if field.field.required %}<span class="text-danger">*</span>{% endif %}
</label>
{{ field }}
{% if help_text %}<div class="form-text">{{ help_text }}</div>{% endif %}
{% if field.help_text and not help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}<div class="text-danger small">{{ field.errors|striptags }}</div>{% endif %}
{% if wrapper_class %}</div>{% endif %}
