{% extends 'core/base.html' %}
{% load socialaccount %}
{% block title %}Sign Up | Mess Management{% endblock %}

{% block content %}
<main class="container my-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body p-5">
          <h2 class="text-center mb-4">Create Account</h2>
          <div class="d-grid gap-2 mb-3">
            {% if google_enabled %}
            <a href="{% url 'account_login' %}" class="btn btn-outline-secondary btn-sm">Already have an account? Login</a>
            {% endif %}
            <form method="post" action="{% url 'account_signup' %}">
              {% csrf_token %}
              <button type="submit" class="btn btn-success w-100">Sign up with email/username</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
</main>
{% endblock %}
